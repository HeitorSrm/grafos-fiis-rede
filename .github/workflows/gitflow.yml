name: Gitflow

on:
  pull_request:
    branches: [main]

jobs:
  verificar-origem:
    name: verificar-origem
    runs-on: ubuntu-latest
    steps:
      - name: PR para main só pode vir de develop ou hotfix/*
        run: |
          HEAD="${{ github.head_ref }}"
          if [ "$HEAD" != "develop" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::PRs para main devem vir de 'develop' (ou 'hotfix/*'). Origem atual: $HEAD"
            exit 1
          fi
